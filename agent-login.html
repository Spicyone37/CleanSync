<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanSync — Connexion Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

/* CleanSync UI guard: évite un double écran si le HTML est collé deux fois dans la page publiée */
document.addEventListener('DOMContentLoaded', () => {
  const containers = [...document.querySelectorAll('body > .container')];
  containers.slice(1).forEach(node => node.remove());
});

</script>
<style>
:root{--bg:#0f1110;--surface:#1a1f1c;--surface2:#232925;--border:rgba(255,255,255,.08);--text:#edf1ee;--muted:#88958d;--green:#1D9E75;--green2:#27bc8d;--red:#e05c5c;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;}
.container{width:100%;max-width:420px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;}
.logo{text-align:center;margin-bottom:28px;}
.logo-badge{width:70px;height:70px;margin:auto auto 16px;border-radius:20px;background:rgba(29,158,117,.12);display:flex;align-items:center;justify-content:center;font-size:34px;}
.logo h1{font-size:28px;margin-bottom:6px;}
.logo p{color:var(--muted);font-size:14px;}
.field{margin-bottom:18px;}
.field label{display:block;margin-bottom:8px;color:var(--muted);font-size:13px;}
.field input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d0f0e;color:white;font-size:15px;outline:none;font-family:'DM Sans',sans-serif;}
.field input:focus{border-color:var(--green);}
.phone-wrap{display:flex;gap:8px;}
.prefix{background:#0d0f0e;border:1px solid var(--border);border-radius:12px;padding:14px 12px;color:var(--muted);font-size:14px;white-space:nowrap;flex-shrink:0;}
.phone-wrap input{flex:1;}
.btn{width:100%;border:none;cursor:pointer;border-radius:14px;padding:15px;background:var(--green);color:white;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.2s;}
.btn:hover{background:var(--green2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hidden{display:none;}
.otp-wrap{margin:20px 0;}
.otp-label{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px;}
.otp-label strong{color:var(--text);}
.otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.otp-digit{width:48px;height:58px;text-align:center;font-size:24px;font-weight:600;border-radius:12px;border:1px solid var(--border);background:#0d0f0e;color:white;outline:none;font-family:'DM Sans',sans-serif;-webkit-appearance:none;}
.otp-digit:focus{border-color:var(--green);}
.resend{text-align:center;margin-top:12px;font-size:13px;color:var(--muted);}
.resend button{background:none;border:none;color:var(--green);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;text-decoration:underline;}
.resend button:disabled{color:var(--muted);text-decoration:none;cursor:default;}
.message{margin-top:18px;text-align:center;font-size:14px;padding:10px;border-radius:10px;}
.message.success{color:#53d4a7;background:rgba(83,212,167,.08);}
.message.error{color:var(--red);background:rgba(224,92,92,.08);}
.hint{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.loader{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}


/* === CleanSync UI DevOps polish v2 === */
:where(button,a,input,select,textarea){outline-offset:3px}
:where(button,a,input,select,textarea):focus-visible{outline:2px solid var(--teal,#1D9E75)!important;outline-offset:3px}
:where(.card,.auth-card,.kpi-card,.prest-card,.agent-card,.recap-card,.table-wrap){box-shadow:0 12px 40px rgba(0,0,0,.10)}
:where(.btn,button){min-height:42px}
:where(input,select,textarea){font-size:16px!important}
html{scroll-behavior:smooth} body{line-height:1.45}
.hidden{display:none!important}
@media (max-width: 720px){
  body{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .container{max-width:440px!important}
  .card,.auth-card{border-radius:22px!important;padding:22px!important}
  .otp-row{gap:6px!important}.otp-digit{width:42px!important;height:52px!important}
  .kpi-strip,.stats,.recap-strip{grid-template-columns:1fr 1fr!important}
  .prest-grid,.agents-grid,.recap-grid{grid-template-columns:1fr!important}
  .drawer{width:100%!important;max-width:none!important}
  table{min-width:720px}.table-wrap,.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media (max-width: 420px){.otp-digit{width:38px!important}.logo h1,.auth-brand-name{font-size:26px!important}}

body{background:radial-gradient(circle at 50% 0%,rgba(29,158,117,.11),transparent 34%),var(--bg)!important;}
.container{isolation:isolate}.container+.container{display:none!important}
.card{box-shadow:0 24px 80px rgba(0,0,0,.32);backdrop-filter:blur(8px)}
.logo-badge{box-shadow:inset 0 0 0 1px rgba(29,158,117,.15)}

</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">
      <div class="logo-badge">🧹</div>
      <h1>CleanSync</h1>
      <p>Espace Agent de ménage</p>
    </div>
    <div id="panel-phone">
      <div class="hint">💡 Entrez votre numéro de téléphone. Un code à 6 chiffres vous sera envoyé par SMS.</div>
      <div class="field">
        <label>Numéro de téléphone</label>
        <div class="phone-wrap">
          <div class="prefix">🇫🇷 +33</div>
          <input type="tel" id="phone-input" placeholder="6 12 34 56 78" autocomplete="tel">
        </div>
      </div>
      <button class="btn" id="btn-phone-send">Recevoir le code SMS</button>
    </div>
    <div id="otp-section" class="hidden">
      <div class="otp-wrap">
        <div class="otp-label">Code envoyé à <strong id="otp-target"></strong></div>
        <div class="otp-row">
          <input class="otp-digit" maxlength="1" inputmode="numeric" type="text">
          <input class="otp-digit" maxlength="1" inputmode="numeric" type="text">
          <input class="otp-digit" maxlength="1" inputmode="numeric" type="text">
          <input class="otp-digit" maxlength="1" inputmode="numeric" type="text">
          <input class="otp-digit" maxlength="1" inputmode="numeric" type="text">
          <input class="otp-digit" maxlength="1" inputmode="numeric" type="text">
        </div>
        <button class="btn" id="btn-verify" disabled>Vérifier le code</button>
        <div class="resend">
          <button id="btn-resend" disabled>Renvoyer le code</button>
          <span id="resend-timer"> dans <span id="resend-count">60</span>s</span>
        </div>
      </div>
      <button class="btn" id="btn-back" style="background:var(--surface2);color:var(--text);margin-top:8px;">← Retour</button>
    </div>
    <div id="message" class="message hidden"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kwwfdhrlvbfdmkmxpwde.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2ZkaHJsdmJmZG1rbXhwd2RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwODU4MjgsImV4cCI6MjA4OTY2MTgyOH0.gPEMKub0ICvotUoY0fU-Yrx1vHpNxaA8OWCVnCxPrvI';
const APP_URL = 'agent-prestation.html';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    storageKey: 'cleansync-agent'
  }
});

let pendingPhone = '';
let resendInterval = null;
let authInProgress = false;

const $ = (id) => document.getElementById(id);

function showMessage(text, type = 'success') {
  const el = $('message');
  el.textContent = text;
  el.className = 'message ' + type;
  el.classList.remove('hidden');
}

function hideMessage() {
  const el = $('message');
  el.textContent = '';
  el.className = 'message hidden';
}

function setLoading(btn, loading) {
  if (loading) {
    btn.dataset.wasDisabled = String(btn.disabled);
    btn.dataset.orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span>';
    return;
  }

  btn.innerHTML = btn.dataset.orig || btn.innerHTML;
  btn.disabled = btn.dataset.wasDisabled === 'true';
}

function normalizePhone(raw) {
  let phone = raw.replace(/[^\d+]/g, '');

  if (phone.startsWith('0033')) phone = '+33' + phone.slice(4);
  if (phone.startsWith('33')) phone = '+33' + phone.slice(2);
  if (phone.startsWith('0')) phone = '+33' + phone.slice(1);
  if (!phone.startsWith('+')) phone = '+33' + phone;

  return phone;
}

function isValidFrenchMobile(phone) {
  return /^\+33[67]\d{8}$/.test(phone);
}

function getOtpCode() {
  return [...document.querySelectorAll('.otp-digit')].map(input => input.value).join('');
}

function checkReady() {
  $('btn-verify').disabled = getOtpCode().length !== 6;
}

function setupOTPInputs() {
  const inputs = document.querySelectorAll('.otp-digit');

  inputs.forEach((input, i) => {
    input.value = '';

    input.oninput = (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(-1);
      if (e.target.value && i < inputs.length - 1) inputs[i + 1].focus();
      checkReady();
    };

    input.onkeydown = (e) => {
      if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus();
    };

    input.onpaste = (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData)
        .getData('text')
        .replace(/\D/g, '')
        .slice(0, 6);

      pasted.split('').forEach((digit, index) => {
        if (inputs[index]) inputs[index].value = digit;
      });

      const nextIndex = Math.min(pasted.length, inputs.length - 1);
      inputs[nextIndex].focus();
      checkReady();
    };
  });

  checkReady();
  inputs[0].focus();
}

function startResendTimer() {
  let sec = 60;
  const btn = $('btn-resend');
  const timer = $('resend-timer');
  const count = $('resend-count');

  btn.disabled = true;
  timer.style.display = 'inline';
  count.textContent = sec;

  if (resendInterval) clearInterval(resendInterval);

  resendInterval = setInterval(() => {
    sec -= 1;
    count.textContent = sec;

    if (sec <= 0) {
      clearInterval(resendInterval);
      resendInterval = null;
      btn.disabled = false;
      timer.style.display = 'none';
    }
  }, 1000);
}

async function sendOtp(phone, isResend = false) {
  const { error } = await sb.auth.signInWithOtp({
    phone,
    options: {
      channel: 'sms',
      shouldCreateUser: false
    }
  });

  if (error) throw error;

  pendingPhone = phone;
  $('otp-target').textContent = phone;
  $('panel-phone').classList.add('hidden');
  $('otp-section').classList.remove('hidden');

  setupOTPInputs();
  startResendTimer();
  showMessage(isResend ? 'Code renvoyé ✓' : 'Code SMS envoyé ✓', 'success');
}

// ENVOYER CODE SMS
$('btn-phone-send').addEventListener('click', async () => {
  const btn = $('btn-phone-send');
  const phone = normalizePhone($('phone-input').value.trim());

  hideMessage();

  if (!isValidFrenchMobile(phone)) {
    showMessage('Entrez un numéro mobile français valide, par exemple 06 12 34 56 78.', 'error');
    return;
  }

  setLoading(btn, true);

  try {
    await sendOtp(phone);
  } catch (error) {
    showMessage(error.message || 'Impossible d’envoyer le SMS.', 'error');
  } finally {
    setLoading(btn, false);
  }
});

$('btn-resend').addEventListener('click', async () => {
  const btn = $('btn-resend');

  if (!pendingPhone) {
    showMessage('Aucun numéro en attente. Revenez à l’étape précédente.', 'error');
    return;
  }

  hideMessage();
  setLoading(btn, true);

  try {
    await sendOtp(pendingPhone, true);
  } catch (error) {
    showMessage(error.message || 'Impossible de renvoyer le code.', 'error');
  } finally {
    setLoading(btn, false);
    btn.disabled = true;
  }
});

$('btn-back').addEventListener('click', () => {
  $('otp-section').classList.add('hidden');
  $('panel-phone').classList.remove('hidden');
  hideMessage();

  if (resendInterval) {
    clearInterval(resendInterval);
    resendInterval = null;
  }
});

// VÉRIFIER OTP
$('btn-verify').addEventListener('click', async () => {
  const code = getOtpCode();
  const btn = $('btn-verify');

  hideMessage();

  if (!pendingPhone || code.length !== 6) {
    showMessage('Code incomplet.', 'error');
    return;
  }

  setLoading(btn, true);

  try {
    const { data, error } = await sb.auth.verifyOtp({
      phone: pendingPhone,
      token: code,
      type: 'sms'
    });

    if (error) throw error;

    await handleAuth(data.user);
  } catch (error) {
    showMessage('Code incorrect ou expiré.', 'error');
    setLoading(btn, false);
    checkReady();
  }
});

// POST-AUTH
async function handleAuth(user) {
  if (!user || authInProgress) return;

  authInProgress = true;

  try {
    const { data: agent, error } = await sb
      .from('agents')
      .select('*')
      .eq('user_id', user.id)
      .maybeSingle();

    if (error) throw error;

    if (!agent) {
      await sb.auth.signOut();
      showMessage('Compte agent non trouvé. Contactez votre gestionnaire.', 'error');
      return;
    }

    if (!agent.actif) {
      await sb.auth.signOut();
      showMessage('Compte désactivé.', 'error');
      return;
    }

    sessionStorage.setItem('cleansync_agent', JSON.stringify(agent));
    showMessage('Connexion réussie ! Redirection...', 'success');

    setTimeout(() => {
      window.location.href = APP_URL;
    }, 800);
  } catch (error) {
    showMessage('Erreur inattendue : ' + (error.message || error), 'error');
    authInProgress = false;
  }
}

// SESSION EXISTANTE
(async () => {
  try {
    const { data: { session }, error } = await sb.auth.getSession();

    if (error) throw error;

    if (session?.user) {
      await handleAuth(session.user);
      return;
    }

    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        await handleAuth(session.user);
      }
    });
  } catch (error) {
    showMessage('Erreur de session : ' + (error.message || error), 'error');
  }
})();
</script>

</body>
</html>
